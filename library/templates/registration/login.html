{% extends "library/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width: 400px"><div class="card-body">
  <h3 class="mb-3">Librarian login</h3>
  {% if form.errors %}<div class="alert alert-danger">Wrong username or password.</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="id_username">Username</label>
      <input class="form-control" type="text" name="username" id="id_username" autofocus required>
    </div>
    <div class="mb-3">
      <label class="form-label" for="id_password">Password</label>
      <input class="form-control" type="password" name="password" id="id_password" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn-primary w-100" type="submit">Log in</button>
  </form>
</div></div>
{% endblock %}
