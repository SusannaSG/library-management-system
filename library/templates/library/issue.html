{% extends "library/base.html" %}
{% block title %}Issue a book{% endblock %}
{% block content %}
<h2 class="mb-3">Issue a book</h2>
<div class="card" style="max-width: 520px"><div class="card-body">
  <form method="post">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label" for="{{ form.member.id_for_label }}">Member</label>
      {{ form.member }}
      {{ form.member.errors }}
    </div>
    <div class="mb-3">
      <label class="form-label" for="{{ form.book.id_for_label }}">Book</label>
      {{ form.book }}
      {{ form.book.errors }}
    </div>
    <button class="btn btn-primary" type="submit">Issue book</button>
    <a class="btn btn-link" href="{% url 'loans' %}">Cancel</a>
  </form>
</div></div>
{% endblock %}
